services:
  - type: web
    name: whisperwall
    env: python
    plan: free
    buildCommand: cd whisperwall && pip install -r requirements.txt && python manage.py collectstatic --noinput --clear
    startCommand: cd whisperwall && gunicorn whisperwall.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --worker-class sync --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_SECRET_KEY
        scope: project
        value: your-very-long-random-secret-key-here-min-50-characters
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: anti-depression.onrender.com,www.anti-depression.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://anti-depression.onrender.com,https://www.anti-depression.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"