services:
  - type: web
    name: whisperwall
    env: python
    buildCommand: cd whisperwall && pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: cd whisperwall && gunicorn whisperwall.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --worker-class sync --timeout 60
    envVars:
      - key: DJANGO_DEBUG
        value: 'False'
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: DJANGO_SETTINGS_MODULE
        value: 'whisperwall.settings'
    plan: free
