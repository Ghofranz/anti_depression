services:
  - type: web
    name: whisperwall
    env: python
    plan: free
    buildCommand: |
      cd whisperwall && \
      pip install -r requirements.txt && \
      python manage.py collectstatic --noinput --clear --verbosity 2
    startCommand: |
      cd whisperwall && \
      gunicorn whisperwall.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --worker-class sync --timeout 120 --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_SECRET_KEY
        scope: project
        value: your-very-long-random-secret-key-here-min-50-characters
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: anti-depression.onrender.com,www.anti-depression.onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://anti-depression.onrender.com,https://www.anti-depression.onrender.com,http://localhost:3000,http://127.0.0.1:3000
      - key: PYTHONUNBUFFERED
        value: "1"