<div class="watch-container">
  
  <main class="video-stage">
    <div class="player-wrapper" [style.background]="'linear-gradient(to bottom, #000, ' + event.color + ')'">
      <div class="overlay-status">LIVE</div>
      <div class="play-icon">▶</div>
    </div>

    <div class="video-info">
      <h1 class="title">{{ event.title }}</h1>
      <p class="stats">{{ event.views }} watching • Started 12 mins ago</p>
      
      <div class="channel-info">
        <div class="avatar"></div>
        <div>
          <p class="name">{{ event.host }}</p>
          <p class="text-xs text-slate-500">Event Organizer</p>
        </div>
        <button class="ml-auto bg-black text-white px-4 py-2 rounded-full text-sm font-bold">
          Join Event
        </button>
      </div>

      <div class="mt-4 p-4 bg-slate-100 rounded-xl text-sm">
        {{ event.description }}
      </div>
    </div>
  </main>

  <aside class="sidebar">
    <div class="chat-box">
      <div class="chat-header">Live Event Chat</div>
      <div class="messages">
        <div class="flex gap-2">
          <span class="font-bold text-blue-600">Student_404:</span>
          <span>Is this actually happening in the basement?</span>
        </div>
        <div class="flex gap-2">
          <span class="font-bold text-rose-500">MysteryGirl:</span>
          <span>GO FOR THE K.O.! 🥊</span>
        </div>
      </div>
      <div class="chat-input">
        <input type="text" placeholder="Say something..." 
               class="w-full bg-slate-100 border-none rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-slate-300">
      </div>
    </div>
  </aside>

</div>
