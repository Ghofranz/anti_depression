<div class="h-screen bg-gradient-to-b from-black via-gray-900 to-purple-900 flex flex-col text-white">

  <!-- Header -->
  Anonymous Match

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">

    <div *ngFor="let msg of messages"
         [ngClass]="msg.from === 'me' ? 'text-right' : 'text-left'">

      <div
        class="inline-block max-w-xs px-4 py-2 rounded-2xl text-sm"
        [ngClass]="msg.from === 'me'
          ? 'bg-purple-600 rounded-br-none'
          : 'bg-white/10 rounded-bl-none'">

        {{ msg.text }}
      </div>

      <div class="text-xs text-gray-400 mt-1">
        {{ msg.time }}
      </div>

    </div>

  </div>

  <!-- Input -->
  <div class="p-4 bg-black/40 backdrop-blur border-t border-white/10 flex gap-2">

    <input
      [(ngModel)]="newMessage"
      placeholder="Write a whisper..."
      class="flex-1 px-4 py-2 bg-black/50 rounded-full outline-none border border-white/10 focus:border-purple-500"/>

    <button
      (click)="send()"
      class="px-5 py-2 rounded-full bg-purple-600 hover:bg-purple-700 transition">
      ➤
    </button>

  </div>

</div>
