<div class="h-screen bg-gradient-to-b from-black via-blue-900 to-indigo-900 flex flex-col text-white">

  <!-- Header -->
  <div class="p-4 bg-black/40 backdrop-blur border-b border-white/10 flex flex-col gap-2 shadow-lg z-10">
    <div class="flex justify-between items-center px-1">
      <h2 class="text-xl font-bold flex items-center gap-2 text-cyan-200">
        <span class="text-2xl">🎓</span> Academic Match Discussion
      </h2>
      <span *ngIf="matchContext" class="text-xs font-bold px-3 py-1 bg-indigo-600/80 rounded-full border border-indigo-400">
        Relevance: {{ matchContext.score | number:'1.0-2' }}
      </span>
    </div>

    <!-- Match Context -->
    <div *ngIf="matchContext" class="grid grid-cols-2 gap-4 text-sm mt-3">
      <div class="bg-white/5 p-4 rounded-xl border border-indigo-500/30 backdrop-blur-md">
        <div class="text-indigo-300 font-bold mb-2 uppercase tracking-wide text-xs">My Situation</div>
        <div class="italic text-gray-200">"{{ getMyConfession()?.text }}"</div>
      </div>
      <div class="bg-white/5 p-4 rounded-xl border border-white/10 backdrop-blur-md">
        <div class="text-gray-300 font-bold mb-2 uppercase tracking-wide text-xs">Peer's Situation</div>
        <div *ngIf="getOtherConfession()?.is_revealed" class="italic text-gray-200">
          "{{ getOtherConfession()?.text }}"
        </div>
        <div *ngIf="!getOtherConfession()?.is_revealed" class="text-gray-400 flex items-center gap-2 py-1">
          🔒 Profile Locked
        </div>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">

    <div *ngIf="messages.length === 0 && !loading" class="text-center text-gray-400 my-8">
      Start the discussion...
    </div>

    <div *ngIf="loading" class="text-center text-gray-400 my-8 flex justify-center items-center gap-2">
      <span class="animate-pulse">Loading messages...</span>
    </div>

    <div *ngFor="let msg of messages"
         [ngClass]="msg.from === 'me' ? 'text-right' : 'text-left'">

      <div
        class="inline-block max-w-xs px-4 py-3 rounded-2xl text-sm shadow-md"
        [ngClass]="msg.from === 'me'
          ? 'bg-indigo-600 rounded-br-none text-white'
          : 'bg-white/10 rounded-bl-none text-gray-100 border border-white/5'">

        {{ msg.text }}
      </div>

      <div class="text-xs text-indigo-300/50 mt-1 px-1">
        {{ msg.time }}
      </div>

    </div>

  </div>

  <!-- Input -->
  <div class="p-4 bg-black/40 backdrop-blur border-t border-white/10 flex gap-2">

    <input
      [(ngModel)]="newMessage"
      (keyup.enter)="send()"
      placeholder="Write a message..."
      class="flex-1 px-5 py-3 bg-white/5 rounded-full outline-none border border-white/10 focus:border-indigo-500 transition shadow-inner text-white placeholder-gray-500"/>

    <button
      (click)="send()"
      class="px-6 py-3 rounded-full bg-indigo-600 hover:bg-indigo-700 transition font-bold shadow-lg active:scale-95">
      Send
    </button>

  </div>

</div>
