<div
  class="min-h-screen flex items-center justify-center p-6 bg-cover bg-center bg-no-repeat relative overflow-hidden"
  style="background-image: url('/portal-bg.png');">

  <!-- Subtle dark overlay for readability -->
  <div class="absolute inset-0 bg-black/35"></div>

  <div class="relative z-10 bg-white rounded-2xl shadow-xl p-8 w-full max-w-lg">

    <h2 class="text-3xl font-bold text-center text-indigo-700 mb-6">
      Share an Academic Situation
    </h2>

    <!-- Situation Description -->
    <div class="flex items-center justify-between mb-2">
      <label class="text-sm font-semibold text-slate-700">
        Situation Description
      </label>

      <button
        type="button"
        (click)="openHelpPopup(0)"
        class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 font-bold hover:bg-indigo-200 transition">
        ?
      </button>
    </div>

    <textarea
      [(ngModel)]="text"
      class="w-full p-4 border rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-400"
      placeholder="Describe what you need help with or what you are looking for..."
      rows="5">
    </textarea>

    <!-- Category -->
    <div class="flex items-center justify-between mb-2">
      <label class="text-sm font-semibold text-slate-700">
        Category
      </label>

      <button
        type="button"
        (click)="openHelpPopup(1)"
        class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 font-bold hover:bg-indigo-200 transition">
        ?
      </button>
    </div>

    <select
      [(ngModel)]="emotion"
      class="w-full p-3 border rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-400">

      <option value="course_help">Course Help</option>
      <option value="project_team">Project Team</option>
      <option value="exam_preparation">Exam Preparation</option>
      <option value="study_group">Study Group</option>
      <option value="internship_advice">Internship Advice</option>
      <option value="administrative_request">Administrative Request</option>
      <option value="lost_found">Lost / Found</option>
    </select>

    <!-- Campus Context -->
    <div class="flex items-center justify-between mb-2">
      <label class="text-sm font-semibold text-slate-700">
        Campus Context
      </label>

      <button
        type="button"
        (click)="openHelpPopup(2)"
        class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 font-bold hover:bg-indigo-200 transition">
        ?
      </button>
    </div>

    <input
      [(ngModel)]="location"
      class="w-full p-3 border rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-400"
      placeholder="Course, classroom, campus place, or context..."
    />

    <div class="text-red-500 text-sm mb-3" *ngIf="error">
      {{ error }}
    </div>

    <button
      (click)="submit()"
      [disabled]="loading"
      class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition disabled:opacity-60">
      {{ loading ? 'Submitting...' : 'Submit Situation' }}
    </button>
  </div>

  <!-- Help Popup -->
  <div
    *ngIf="showHelpPopup"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-md p-4">

    <div class="w-full max-w-[420px] bg-white rounded-3xl shadow-2xl border border-white/60 p-7 relative">

      <button
        type="button"
        (click)="closeHelpPopup()"
        class="absolute top-4 right-4 text-slate-400 hover:text-indigo-600 transition text-2xl leading-none">
        ×
      </button>

      <div class="inline-flex items-center px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-extrabold mb-5">
        Tip {{ currentHelpIndex + 1 }} of {{ helpPopups.length }}
      </div>

      <h3 class="text-2xl font-extrabold text-slate-900 leading-snug mb-4 pr-6">
        {{ currentHelp.title }}
      </h3>

      <p class="text-slate-600 text-sm leading-relaxed">
        {{ currentHelp.message }}
      </p>

      <label class="flex items-center gap-2 mt-5 text-sm text-slate-500 cursor-pointer select-none">
        <input
          type="checkbox"
          [(ngModel)]="neverShowHelpAgain"
          class="w-4 h-4 accent-indigo-600">
        Never show me again
      </label>

      <div class="flex gap-3 mt-7">
        <button
          type="button"
          (click)="closeHelpPopup()"
          class="flex-1 px-4 py-3 rounded-xl bg-slate-100 text-slate-700 font-bold hover:bg-slate-200 transition">
          Skip
        </button>

        <button
          type="button"
          (click)="nextHelpPopup()"
          class="flex-1 px-4 py-3 rounded-xl bg-indigo-700 text-white font-bold hover:bg-indigo-800 transition shadow-lg shadow-indigo-700/20">
          {{ currentHelpIndex < helpPopups.length - 1 ? 'Next' : 'Got it' }}
        </button>
      </div>

    </div>
  </div>

</div>
