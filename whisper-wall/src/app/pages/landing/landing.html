<div class="min-h-screen bg-gradient-to-br from-black via-purple-900 to-black text-white flex flex-col justify-center items-center text-center px-6">

  <!-- Title -->
  <h1 class="text-5xl md:text-6xl font-extrabold mb-6 bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">
    Whisper Radar
  </h1>

  <!-- Subtitle -->
  <p class="max-w-xl text-gray-300 text-lg mb-10">
    Confess your feelings anonymously.  
    If they feel the same…  
    the secret reveals itself.
  </p>

  <!-- Buttons -->
  <div class="flex flex-col sm:flex-row gap-4">

    <button
      (click)="start()"
      class="px-8 py-3 rounded-full bg-pink-500 hover:bg-pink-600 transition font-semibold">
      💌 Make a Confession
    </button>

    <button
      (click)="viewMatches()"
      class="px-8 py-3 rounded-full border border-purple-400 hover:bg-purple-600 transition">
      💞 View Matches
    </button>

  </div>

  <!-- Footer -->
  <p class="absolute bottom-6 text-gray-500 text-sm">
    Anonymous. Safe. Mutual.
  </p>


<!-- Signup Modal -->
<div *ngIf="showSignup"
     class="fixed inset-0 bg-black/60 flex items-center justify-center z-50"
     (click)="closeModal()">

  <div
    class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 relative text-gray-700"
    (click)="$event.stopPropagation()">

    <!-- Close Button -->
    <button
      class="absolute top-4 right-4 text-gray-500 hover:text-black text-xl"
      (click)="closeModal()">
      ✕
    </button>

    <!-- Title -->
    <h2 class="text-2xl font-bold text-gray-900 leading-snug">
      Create your <br>
      <span class="text-indigo-600">anonymous profile</span>
    </h2>

    <p class="text-gray-500 mt-2 mb-6 text-sm">
      Your identity stays hidden until you both choose to reveal.
    </p>

    <!-- Name -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1 ">Name *</label>
      <input
        [(ngModel)]="form.name"
        type="text"
        placeholder="What should we call you?"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"/>
    </div>

    <!-- Email -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">
        Email <span class="text-gray-400">(optional)</span>
      </label>
      <input
        [(ngModel)]="form.email"
        type="email"
        placeholder="your@email.com"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"/>
    </div>

    <!-- User Name
      -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">User Name *</label>
      <input
        [(ngModel)]="form.userName"
        type="text"
        placeholder="Choose a username"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"/>
    </div>

    <!-- username -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">
        username <span class="text-gray-400">(optional)</span>
      </label>
      <input
        [(ngModel)]="form.userName"
        type="text"
        min="13"
        max="99"
        placeholder="e.g. 21"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"/>
    </div>

    <!-- Password -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Password *</label>
      <input
        [(ngModel)]="form.password"
        type="password"
        placeholder="Min 6 characters"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"/>
    </div>

    <!-- Confirm Password -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Confirm Password *</label>
      <input
        [(ngModel)]="form.confirmPassword"
        type="password"
        placeholder="Repeat password"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"/>
    </div>

    <!-- Error -->
    <p *ngIf="error"
       class="text-red-500 text-sm mb-4">
       {{ error }}
    </p>

    <!-- Submit -->
    <button
      (click)="submitSignup()"
      [disabled]="loading"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition disabled:opacity-50">

      {{ loading ? 'Creating profile...' : '🚀 Start Confessing' }}
    </button>

    <!-- Privacy -->
    <p class="text-xs text-gray-400 text-center mt-4">
      🔒 We never show your name or email without mutual consent.
    </p>

  </div>
</div>
